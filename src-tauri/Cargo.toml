[package]
name = "intervjuare"
version = "0.1.0"
description = "Private macOS interview copilot"
authors = ["Rafal Chorazewicz"]
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "intervjuare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.6", features = [] }
yaml-rust2 = "0.13.0"
